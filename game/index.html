<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Săn Gà Rừng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #fff3d6;
    --ink-dim: #c8b89a;
    --edge: #120d18;
    --gold: #f2c94c;
    --gold-dark: #5a3f1c;
    --panel: #2a2035;
    --hp: #e0453a;
    --mp: #3a8ee6;
    --exp: #f2c94c;
    --good: #7ed957;
    --px: "VT323", ui-monospace, "Courier New", monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #3d7a2c;
    color: var(--ink);
    font-family: var(--px);
    font-size: 18px;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { position: fixed; inset: 0; }
  #cv { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; image-rendering: pixelated; }
  canvas.icon { image-rendering: pixelated; image-rendering: crisp-edges; }

  .panel {
    background: var(--panel);
    border: 3px solid var(--edge);
    box-shadow: inset 0 0 0 2px var(--gold), inset 0 0 0 4px var(--gold-dark), 4px 4px 0 rgba(0, 0, 0, 0.45);
  }

  #status {
    position: absolute;
    top: calc(10px + env(safe-area-inset-top, 0px));
    left: calc(10px + env(safe-area-inset-left, 0px));
    display: flex; gap: 8px; align-items: center;
    padding: 8px 10px 8px 8px;
  }
  #avatar {
    width: 56px; height: 56px; flex: none;
    background: #4f8f3a; border: 3px solid var(--edge);
    box-shadow: inset 0 0 0 2px var(--gold);
  }
  .bars { display: grid; gap: 3px; width: 170px; min-width: 0; overflow: hidden; }
  .name { font-size: 20px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name b { color: var(--gold); font-weight: 400; }
  .bar { position: relative; height: 14px; background: #3a2a3a; border: 2px solid var(--edge); }
  .bar.thin { height: 6px; }
  .bar i { position: absolute; inset: 0 auto 0 0; box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.28), inset 0 -2px 0 rgba(0, 0, 0, 0.25); }
  .bar.hp i { background: var(--hp); }
  .bar.mp i { background: var(--mp); }
  .bar.exp i { background: var(--exp); }
  .bar span { position: absolute; inset: 0; font-size: 16px; line-height: 13px; text-align: center; text-shadow: 1px 1px 0 var(--edge); }
  .purse { display: flex; gap: 10px; align-items: center; font-size: 17px; line-height: 16px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; }
  .purse b { color: var(--gold); font-weight: 400; }
  #reset {
    margin-left: auto; flex: none; font: 15px var(--px); line-height: 14px; color: var(--ink-dim); cursor: pointer;
    background: #3a2a3a; border: 2px solid var(--edge); padding: 0 5px;
  }
  #reset.armed { color: #fff; background: #8a241d; }

  #right {
    position: absolute;
    top: calc(10px + env(safe-area-inset-top, 0px));
    right: calc(10px + env(safe-area-inset-right, 0px));
    display: grid; gap: 8px; width: 196px;
  }
  #mapbox { min-width: 0; overflow: hidden; padding: 7px; display: grid; gap: 3px; }
  #mapbox .row { display: flex; justify-content: space-between; gap: 4px; font-size: 17px; line-height: 16px; color: var(--ink-dim); white-space: nowrap; }
  #zone { color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
  #mini { width: 100%; aspect-ratio: 3 / 2; display: block; border: 2px solid var(--edge); image-rendering: pixelated; }
  #quest { min-width: 0; overflow: hidden; padding: 8px 10px; display: grid; gap: 1px; line-height: 17px; }
  #quest .tag { font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
  #qTitle { font-size: 19px; color: var(--ink); }
  #qDesc { font-size: 17px; color: var(--ink-dim); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; }
  #qProg { color: var(--gold); }
  #qProg.done { color: var(--good); }

  #actions {
    position: absolute;
    right: calc(14px + env(safe-area-inset-right, 0px));
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    width: 196px; height: 172px;
  }
  .btn {
    position: absolute; display: grid; place-items: center; padding: 0; cursor: pointer;
    border: 3px solid var(--edge); color: var(--ink); font-family: var(--px);
    box-shadow: inset -4px -4px 0 rgba(0, 0, 0, 0.35), inset 4px 4px 0 rgba(255, 255, 255, 0.22), 4px 4px 0 rgba(0, 0, 0, 0.45);
    touch-action: none;
  }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .btn:active { transform: translate(2px, 2px); box-shadow: inset 4px 4px 0 rgba(0, 0, 0, 0.35), 2px 2px 0 rgba(0, 0, 0, 0.45); }
  .btn canvas { width: 60%; height: 60%; pointer-events: none; }
  .btn .cd { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--cd, 0) * 100%); background: rgba(10, 6, 16, 0.65); pointer-events: none; }
  .btn .key { position: absolute; bottom: -8px; right: -8px; font-size: 15px; line-height: 14px; background: var(--edge); color: var(--gold); padding: 1px 4px; }
  .btn .count { position: absolute; top: -9px; right: -9px; min-width: 20px; font-size: 16px; line-height: 16px; background: var(--hp); border: 2px solid var(--edge); padding: 0 3px; text-align: center; }
  #bAtk { width: 84px; height: 84px; right: 0; bottom: 0; background: #b3342f; }
  #bSkill { width: 62px; height: 62px; right: 96px; bottom: 4px; background: #2d5f9e; }
  #bPot { width: 54px; height: 54px; right: 86px; bottom: 80px; background: #7a4a24; }
  #bAuto { width: 54px; height: 54px; right: 14px; bottom: 100px; background: #4a3a52; font-size: 20px; }
  #bAuto.on { background: var(--gold); color: var(--edge); }

  #hint {
    position: absolute; left: calc(10px + env(safe-area-inset-left, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    padding: 7px 11px; font-size: 17px; line-height: 18px; color: var(--ink-dim);
  }
  #hint b { color: var(--gold); font-weight: 400; }
  @media (hover: none) { #hint, .btn .key { display: none; } }

  #stick {
    position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
    border: 3px solid rgba(255, 243, 214, 0.5); background: rgba(18, 13, 24, 0.25); pointer-events: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    background: rgba(255, 243, 214, 0.6); border: 3px solid var(--edge);
  }

  #toast {
    position: absolute; left: 50%; top: calc(20% + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    display: grid; gap: 6px; justify-items: center; pointer-events: none; width: min(92vw, 480px);
  }
  .msg {
    padding: 4px 14px; background: var(--panel); border: 3px solid var(--edge);
    box-shadow: inset 0 0 0 2px var(--gold), 4px 4px 0 rgba(0, 0, 0, 0.45);
    font-size: 22px; line-height: 22px; text-align: center; animation: msg 3s steps(1, end) forwards;
  }
  .msg.big { font-size: 30px; line-height: 30px; color: var(--gold); padding: 6px 18px; }
  @keyframes msg { 0% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }

  #dead {
    position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px;
    background: rgba(60, 0, 10, 0.55); font-size: 46px; line-height: 44px; text-shadow: 3px 3px 0 var(--edge);
  }
  #dead small { font-size: 22px; line-height: 22px; color: var(--ink-dim); }

  @media (max-width: 640px) {
    #right { width: 136px; }
    #quest { padding: 6px 8px; }
    #qTitle { font-size: 17px; line-height: 16px; }
    #qDesc { font-size: 15px; line-height: 15px; }
    .bars { width: 132px; }
    #avatar { width: 44px; height: 44px; }
    .name { font-size: 18px; }
    .purse { font-size: 15px; gap: 6px; }
    #toast { top: calc(34% + env(safe-area-inset-top, 0px)); }
    .msg { font-size: 18px; line-height: 18px; }
    .msg.big { font-size: 24px; line-height: 24px; }
    #coord { display: none; }
  }
</style>
</head>
<body>

<div id="game">
  <canvas id="cv" aria-label="Bản đồ trò chơi"></canvas>

  <div id="status" class="panel">
    <canvas id="avatar" class="icon" width="16" height="16"></canvas>
    <div class="bars">
      <div class="name">Kiếm Khách <b id="lv">Lv.1</b></div>
      <div class="bar hp"><i id="hpBar"></i><span id="hpTxt"></span></div>
      <div class="bar mp"><i id="mpBar"></i><span id="mpTxt"></span></div>
      <div class="bar thin exp"><i id="expBar"></i></div>
      <div class="purse"><span>Vàng <b id="gold">0</b></span><span>Hạ <b id="kills">0</b></span><button id="reset" type="button">Chơi lại</button></div>
    </div>
  </div>

  <div id="right">
    <div id="mapbox" class="panel">
      <div class="row"><span id="zone">Làng Khởi Đầu</span><span id="coord">0, 0</span></div>
      <canvas id="mini" width="180" height="120"></canvas>
    </div>
    <div id="quest" class="panel">
      <div class="tag">Nhiệm vụ chính</div>
      <div id="qTitle"></div>
      <div id="qDesc"><span id="qText"></span><span id="qProg"></span></div>
    </div>
  </div>

  <div id="hint" class="panel">
    <b>WASD / mũi tên</b> di chuyển · <b>Click</b> để đi / chọn gà<br>
    <b>J</b> chém · <b>K</b> kiếm xoáy · <b>H</b> ăn đùi gà · <b>Space</b> tự động
  </div>

  <div id="actions">
    <button class="btn" id="bAuto" type="button" aria-label="Tự động đánh">AUTO<span class="key">Space</span></button>
    <button class="btn" id="bPot" type="button" aria-label="Ăn đùi gà hồi máu">
      <canvas class="icon" id="icoPot" width="12" height="12"></canvas>
      <span class="cd" id="potCd"></span><span class="count" id="potN">3</span><span class="key">H</span>
    </button>
    <button class="btn" id="bSkill" type="button" aria-label="Kiếm xoáy">
      <canvas class="icon" id="icoSkill" width="12" height="12"></canvas>
      <span class="cd" id="skCd"></span><span class="key">K</span>
    </button>
    <button class="btn" id="bAtk" type="button" aria-label="Chém">
      <canvas class="icon" id="icoAtk" width="12" height="12"></canvas>
      <span class="key">J</span>
    </button>
  </div>

  <div id="stick" hidden><div id="knob"></div></div>
  <div id="toast"></div>
  <div id="dead" hidden>BẠN ĐÃ GỤC NGÃ<small>Hồi sinh ở làng sau <span id="deadT">3</span> giây…</small></div>
</div>

<script>
(() => {
  "use strict";
  // World units: 3 per art pixel. The map is 800 x 534 art pixels.
  const W = 2400, H = 1600, A = 3;
  const AW = 800, AH = 534;
  const VILLAGE = { x: 230, y: 800 };
  const $ = (id) => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  const PIX = '"VT323", ui-monospace, "Courier New", monospace';

  // ---------- helpers ----------
  let seed = 20260926;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  const R = (a, b) => a + Math.random() * (b - a);
  const RI = (a, b) => Math.floor(R(a, b + 1));
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const angDiff = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
  function hash(x, y, s = 0) {
    let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  const rgb = (c) => { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };

  function fillEll(g, cx, cy, rx, ry, col) {
    g.fillStyle = col;
    for (let dy = -ry; dy <= ry; dy++) {
      const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy / (ry + 0.5)) ** 2)));
      g.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1);
    }
  }
  function pixRing(g, cx, cy, rx, ry, col) {
    g.fillStyle = col;
    const n = Math.ceil(Math.PI * 2 * Math.max(rx, ry) * 1.2), seen = new Set();
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, x = Math.round(cx + Math.cos(a) * rx), y = Math.round(cy + Math.sin(a) * ry);
      const k = x * 10000 + y;
      if (!seen.has(k)) { seen.add(k); g.fillRect(x, y, 1, 1); }
    }
  }
  function line(g, x0, y0, x1, y1, col) {
    g.fillStyle = col;
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      g.fillRect(x0, y0, 1, 1);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  // ---------- sprites ----------
  function sprite(rows, pal) {
    const c = mk(rows[0].length, rows.length), g = c.getContext("2d");
    rows.forEach((row, y) => [...row].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }));
    return c;
  }
  function flip(c) {
    const f = mk(c.width, c.height), g = f.getContext("2d");
    g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0);
    return f;
  }
  const pair = (rows, pal) => { const r = sprite(rows, pal); return { r, l: flip(r) }; };
  const whiteOf = (pal) => Object.fromEntries(Object.entries(pal).map(([k, v]) => [k, k === "k" ? v : "#ffffff"]));

  const HERO_TOP = [
    "....kkkkkk......",
    "..kkhHHHhhkk.k..",
    ".khhHhhhhhhhkhk.",
    ".khhhhhhhhhhhhk.",
    "kkrrrrrrrrrrrk..",
    "khhrhsssssssssk.",
    "khhhsssssesesk..",
    ".khhsssssesesk..",
    ".khSsssssssssk..",
    "..kkSSsssssSk...",
    "...ckkkkkkkk....",
    "..cktttttttTk...",
    ".cckstTtttttsk..",
    ".cksktttttttksk.",
    "..ckbbbbgbbbbk..",
    "...ktttTTtttk...",
    "...kttTkkTttk...",
    "....kpppkppk....",
  ];
  const HERO_LEGS = [
    ["....kpppkppk....", "....kpppkppk....", "...koookkooook..", "...kkkkk.kkkkk.."],
    ["...kpppk.kppk...", "..kpppk...kppk..", ".koook....kook..", ".kkkk.....kkkk.."],
    ["...kppk.kpppk...", "..kppk...kpppk..", ".kook....koook..", ".kkkk....kkkkk.."],
  ];
  const HERO_PAL = {
    k: "#20161c", h: "#2e2438", H: "#5a4a70", r: "#d63a2f", s: "#f2c9a0", S: "#d9a47e", e: "#20161c",
    c: "#6e1d1a", t: "#b3342f", T: "#7e2020", b: "#3b2418", g: "#f2c94c", p: "#2f2a3c", o: "#6b4526",
  };
  const HERO = HERO_LEGS.map((legs) => pair([...HERO_TOP, ...legs], HERO_PAL));

  const CHICK = [
    [
      "........rr..",
      ".......krrk.",
      "......kwwwk.",
      "......kwewyy",
      ".tk...kwwwkr",
      "ttwk..kwwk..",
      "twwwkkwwwk..",
      ".kwwWWWwwwk.",
      ".kwWWWWwwwk.",
      "..kwwwwwwk..",
      "...kkkkkk...",
      "....l..l....",
    ],
  ];
  CHICK.push([...CHICK[0].slice(0, 11), "...l....l..."]);
  const CHICK_PAL = {
    ga:    { k: "#3a2a20", w: "#f6f2ea", W: "#d8cfbd", t: "#cfc4ad", r: "#e0342a", y: "#f0b21a", e: "#1a1010", l: "#e3a21a" },
    trong: { k: "#2a1410", w: "#e8743a", W: "#a8401c", t: "#1f7a64", r: "#e0342a", y: "#f0b21a", e: "#1a1010", l: "#e3a21a" },
    boss:  { k: "#3a2408", w: "#f2c94c", W: "#c08a24", t: "#7a2fb0", r: "#e0342a", y: "#ff9a1a", e: "#b00000", l: "#e3a21a" },
  };
  const CHICKS = {};
  for (const [type, pal] of Object.entries(CHICK_PAL)) {
    CHICKS[type] = { frames: CHICK.map((f) => pair(f, pal)), white: CHICK.map((f) => pair(f, whiteOf(pal))) };
  }
  const CROWN = pair(["g..g..g", "gg.g.gg", "ggggggg", "grgbgrg", "kkkkkkk"], { g: "#ffd84a", r: "#e0342a", b: "#3a8ee6", k: "#5a3a08" });

  const ICONS = {
    icoAtk: [[
      "..........kk", ".........kwk", "........kwk.", ".......kwk..", "......kwk...", "..k..kwk....",
      "..kkkwk.....", "...kgk......", "..kbkgk.....", ".kbk.kk.....", "kbk.........", "kk..........",
    ], { k: "#1a1420", w: "#e8eef5", g: "#f2c94c", b: "#6b4526" }],
    icoPot: [[
      "....kkkk....", "...kmmmmk...", "..kmMmmmmk..", "..kmmmmmmk..", "..kmmmmmmk..", "...kmmmmk...",
      "....kmmk....", ".....kbk....", ".....kbk....", "....kbbbk...", "....kb.bk...", ".....k.k....",
    ], { k: "#1a1420", m: "#d98a3d", M: "#f2b06a", b: "#fff3d6" }],
    icoSkill: [[
      "...kkkkk....", "..kcccccck..", ".kck....kck.", "kck..kk..ck.", "kck.kcck.ck.", "kck.kc.k.ck.",
      "kck..k..kck.", ".kck...kck..", "..kccccck...", "...kkkkk.cc.", ".........ck.", "............",
    ], { k: "#0d1a2e", c: "#bfe4ff" }],
  };

  function makeTree(pal) {
    const w = 30, h = 38, c = mk(w, h), g = c.getContext("2d");
    const blobs = [[15, 13, 10]];
    for (let i = 0; i < 4; i++) blobs.push([15 + (rnd() - 0.5) * 14, 11 + (rnd() - 0.2) * 9, 5 + rnd() * 3]);
    const inside = (x, y) => blobs.some(([bx, by, r]) => (x - bx) ** 2 + (y - by) ** 2 <= r * r);
    for (let y = 20; y < 37; y++) for (let x = 12; x <= 17; x++) {
      g.fillStyle = x === 12 || x === 17 || y === 36 ? "#2a1a10" : x <= 13 ? "#4a2c16" : x === 16 ? "#5a3620" : "#7a4f2c";
      g.fillRect(x, y, 1, 1);
    }
    g.fillStyle = "#2a1a10"; g.fillRect(10, 35, 10, 2);
    g.fillStyle = "#5a3620"; g.fillRect(11, 35, 8, 1);
    for (let y = 0; y < 30; y++) for (let x = 0; x < w; x++) {
      if (inside(x, y)) {
        const d = Math.hypot(x - 10, y - 6) + (hash(x, y, 9) - 0.5) * 3;
        let col = d < 4 ? pal[0] : d < 9 ? pal[1] : d < 14 ? pal[2] : pal[3];
        if (!inside(x, y + 1) || !inside(x, y + 2)) col = pal[3];
        g.fillStyle = col; g.fillRect(x, y, 1, 1);
      } else if (inside(x + 1, y) || inside(x - 1, y) || inside(x, y + 1) || inside(x, y - 1)) {
        g.fillStyle = pal[4]; g.fillRect(x, y, 1, 1);
      }
    }
    return c;
  }
  const TREE_PAL = {
    green: ["#a6dc6a", "#6fbf45", "#4a9a35", "#2f6e27", "#163816"],
    dark:  ["#78b88e", "#4f9068", "#3a7552", "#26573b", "#0f2a1c"],
    pink:  ["#ffe0ec", "#f7aac8", "#e07aa0", "#b2567c", "#4a1a30"],
  };
  const TREES = {};
  for (const k in TREE_PAL) TREES[k] = [0, 1, 2].map(() => makeTree(TREE_PAL[k]));

  function makeHouse(blue) {
    const c = mk(44, 40), g = c.getContext("2d");
    const [roof, roofD, roofO] = blue ? ["#4a7cb0", "#2c5582", "#122238"] : ["#c44a33", "#8a2f22", "#3a1410"];
    g.fillStyle = "#3a2418"; g.fillRect(4, 18, 36, 21);
    for (let y = 19; y < 38; y++) { g.fillStyle = y % 4 === 0 ? "#cdb58a" : "#ecdbb4"; g.fillRect(5, y, 34, 1); }
    g.fillStyle = "#3a2418"; g.fillRect(17, 26, 10, 12);
    g.fillStyle = "#7a4f2c"; g.fillRect(18, 27, 8, 11);
    g.fillStyle = "#5a3620"; g.fillRect(21, 27, 1, 11);

  addEventListener("blur", () => { for (const k in keys) keys[k] = false; atkHeld = false; });

  function toWorld(cx, cy) {
    const r = cv.getBoundingClientRect();
    return { x: (camX + ((cx - r.left) * dpr) / PX) * A, y: (camY + ((cy - r.top) * dpr) / PX) * A };
  }

  cv.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    if (ev.pointerType !== "mouse" && ev.clientX < innerWidth * 0.55) {
      joy = { id: ev.pointerId, ox: ev.clientX, oy: ev.clientY, dx: 0, dy: 0 };
      const st = $("stick"); st.hidden = false;
      const r = $("game").getBoundingClientRect();
      st.style.left = ev.clientX - r.left + "px"; st.style.top = ev.clientY - r.top + "px";
      $("knob").style.transform = "";
      cv.setPointerCapture(ev.pointerId);
      return;
    }
    if (P.dead) return;
    const w = toWorld(ev.clientX, ev.clientY);
    let hit = null;
    for (const e of enemies) if (!e.dead && Math.hypot(e.x - w.x, e.y - 18 * e.T.size - w.y) < 26 * e.T.size + 8) hit = e;
    if (hit) { P.target = hit; P.moveTo = null; }
    else { P.target = null; P.moveTo = { x: clamp(w.x, 10, W - 10), y: clamp(w.y, 10, H - 10) }; clickMark = { ...P.moveTo, t: 0 }; }
  });
  cv.addEventListener("pointermove", (ev) => {
    if (!joy || ev.pointerId !== joy.id) return;
    let dx = ev.clientX - joy.ox, dy = ev.clientY - joy.oy;
    const m = Math.hypot(dx, dy);
    if (m > 50) { dx *= 50 / m; dy *= 50 / m; }
    joy.dx = dx / 50; joy.dy = dy / 50;
    $("knob").style.transform = `translate(${dx}px, ${dy}px)`;
  });
  const endJoy = (ev) => { if (joy && ev.pointerId === joy.id) { joy = null; $("stick").hidden = true; } };
  cv.addEventListener("pointerup", endJoy);
  cv.addEventListener("pointercancel", endJoy);
  cv.addEventListener("contextmenu", (ev) => ev.preventDefault());

  function btn(id, down, up) {
    const el = $(id);
    el.addEventListener("pointerdown", (ev) => { ev.preventDefault(); ev.stopPropagation(); down(); });
    if (up) { el.addEventListener("pointerup", up); el.addEventListener("pointerleave", up); el.addEventListener("pointercancel", up); }
    el.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); down(); if (up) setTimeout(up, 150); } });
  }
  btn("bAtk", () => { atkHeld = true; attack(); }, () => { atkHeld = false; });
  btn("bSkill", skill);
  btn("bPot", potion);
  btn("bAuto", () => setAuto(!auto));

  let resetArmed = 0;
  $("reset").addEventListener("click", () => {
    if (!resetArmed) {
      resetArmed = setTimeout(() => { resetArmed = 0; $("reset").classList.remove("armed"); $("reset").textContent = "Chơi lại"; }, 3000);
      $("reset").classList.add("armed"); $("reset").textContent = "Bấm lại để xóa";
      return;
    }
    clearTimeout(resetArmed); resetArmed = 0;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    Object.assign(S, { lv: 1, exp: 0, gold: 0, pot: 3, qi: 0, qp: 0, kills: 0 });
    applyStats(true);
    P.x = VILLAGE.x + 80; P.y = VILLAGE.y + 30; P.target = null; P.moveTo = null;
    enemies = enemies.filter((e) => e.type !== "boss");
    respawns = respawns.filter((r) => r.type !== "boss");
    $("reset").classList.remove("armed"); $("reset").textContent = "Chơi lại";
    toast("Bắt đầu lại từ đầu");
  });

  // ---------- update ----------
  function collide(o, r) {
    for (const ob of obstacles) {
      const dx = o.x - ob.x, dy = o.y - ob.y, d = Math.hypot(dx, dy), min = ob.r + r;
      if (d < min && d > 0.01) { o.x = ob.x + (dx / d) * min; o.y = ob.y + (dy / d) * min; }
    }
    o.x = clamp(o.x, 20, W - 20); o.y = clamp(o.y, 70, H - 10);
  }

  function autoBrain() {
    if (P.hp < P.maxHp * 0.35) potion();
    const q = quest();
    if (!P.target || P.target.dead) {
      const pref = (e) => (q.type === "any" ? e.type !== "boss" || S.lv >= 9 : e.type === q.type);
      P.target = nearestEnemy(700, pref) || nearestEnemy(260, (e) => e.type !== "boss" || q.type === "boss");
    }
    let near = 0;
    for (const e of enemies) if (!e.dead && dist(e, P) < 115) near++;
    if (near >= 2 || (P.target && P.target.type === "boss" && dist(P.target, P) < 110)) skill();
    if (!P.target && !P.moveTo) {
      const z = q.type === "trong" ? ET.trong.zone : q.type === "boss" ? ET.boss.zone : ET.ga.zone;
      P.moveTo = { x: R(z[0], z[1]), y: R(z[2], z[3]) };
    }
  }

  function updatePlayer(dt) {
    P.atkCd -= dt; P.skCd -= dt; P.potCd -= dt; P.swing -= dt; P.spin -= dt; P.combatT -= dt; P.hurtT = (P.hurtT || 0) - dt;
    if (P.dead) {
      P.deadT -= dt;
      $("deadT").textContent = Math.max(1, Math.ceil(P.deadT));
      if (P.deadT <= 0) {
        P.dead = false; $("dead").hidden = true; applyStats(true);
        P.x = VILLAGE.x + 80; P.y = VILLAGE.y + 30;
        toast("Bạn đã hồi sinh ở làng");
      }
      return;
    }
    let ix = 0, iy = 0;
    if (keys.a || keys.arrowleft) ix -= 1;
    if (keys.d || keys.arrowright) ix += 1;
    if (keys.w || keys.arrowup) iy -= 1;
    if (keys.s || keys.arrowdown) iy += 1;
    if (joy) { ix = joy.dx; iy = joy.dy; }
    const manual = Math.hypot(ix, iy) > 0.15;
    if (manual) { P.moveTo = null; if (!auto) P.target = null; }
    else if (auto) autoBrain();

    const speed = 155;
    let mx = 0, my = 0;
    if (manual) {
      const m = Math.max(1, Math.hypot(ix, iy)); mx = ix / m; my = iy / m;
    } else if (P.target && !P.target.dead) {
      const d = dist(P.target, P);
      if (d > 50 + P.target.T.r) { mx = (P.target.x - P.x) / d; my = (P.target.y - P.y) / d; }
      else attack();
    } else if (P.moveTo) {
      const dx = P.moveTo.x - P.x, dy = P.moveTo.y - P.y, d = Math.hypot(dx, dy);
      if (d < 6) P.moveTo = null; else { mx = dx / d; my = dy / d; }
    }
    P.moving = mx !== 0 || my !== 0;
    if (P.moving) {
      P.x += mx * speed * dt; P.y += my * speed * dt;
      P.aim = Math.atan2(my, mx);
      if (Math.abs(mx) > 0.1) P.face = mx > 0 ? 1 : -1;
      P.walk += dt * 9;
      collide(P, 12);
    }
    if (keys.j || atkHeld) attack();

    P.mp = Math.min(P.maxMp, P.mp + 1.6 * dt);
    if (P.combatT <= 0) P.hp = Math.min(P.maxHp, P.hp + P.maxHp * 0.03 * dt);
    if (Math.hypot(P.x - VILLAGE.x, P.y - VILLAGE.y) < 200) P.hp = Math.min(P.maxHp, P.hp + P.maxHp * 0.08 * dt);
  }

  function updateEnemy(e, dt) {
    const T = e.T;
    e.hitT -= dt; e.atkCd -= dt; e.peck -= dt;
    const d = dist(e, P);
    let mx = 0, my = 0, sp = T.speed;
    if (!P.dead && T.aggressive && e.state === "wander" && d < 150) e.state = "aggro";
    if (e.state === "aggro") {
      if (P.dead || Math.hypot(e.x - e.hx, e.y - e.hy) > 480 || Math.hypot(P.x - VILLAGE.x, P.y - VILLAGE.y) < 200) e.state = "return";
      else {
        if (d > T.r + 20) { mx = (P.x - e.x) / d; my = (P.y - e.y) / d; sp = T.chase; }
        else if (e.atkCd <= 0) { e.atkCd = e.type === "boss" ? 1.4 : 1.25; e.peck = 0.2; hurtPlayer(e.atk * R(0.8, 1.2)); }
        if (Math.abs(P.x - e.x) > 4) e.face = P.x > e.x ? 1 : -1;
        if (e.type === "boss") {
          e.slamCd -= dt;
          if (e.slamCd <= 0 && d < 220 && !e.slam) { e.slam = { x: P.x, y: P.y, t: 0.9 }; e.slamCd = 6; }
        }
      }
    } else if (e.state === "return") {
      const hd = Math.hypot(e.hx - e.x, e.hy - e.y);
      if (hd < 8) { e.state = "wander"; e.hp = e.maxHp; }
      else { mx = (e.hx - e.x) / hd; my = (e.hy - e.y) / hd; sp = T.chase * 1.4; e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.3 * dt); }
    } else {
      e.t -= dt;
      if (e.t <= 0) {
        e.t = R(1, 3);
        if (Math.random() < 0.4) { e.vx = 0; e.vy = 0; if (Math.random() < 0.5) e.peck = 0.3; }
        else { const a = R(0, Math.PI * 2); e.vx = Math.cos(a); e.vy = Math.sin(a); }
      }
      mx = e.vx; my = e.vy;
      const z = T.zone;
      if (e.x < z[0] || e.x > z[1]) { e.vx = e.x < z[0] ? 1 : -1; mx = e.vx; }
      if (e.y < z[2] || e.y > z[3]) { e.vy = e.y < z[2] ? 1 : -1; my = e.vy; }
    }
    if (e.slam) {
      e.slam.t -= dt;
      if (e.slam.t <= 0) {
        if (Math.hypot(P.x - e.slam.x, P.y - e.slam.y) < 105) hurtPlayer(e.atk * 2.2);
        rings.push({ x: e.slam.x, y: e.slam.y, t: 0, life: 0.35, r: 110, col: "#ff7a3a" });
        e.slam = null;
      }
    }
    e.moving = !!(mx || my);
    if (e.moving) {
      e.x += mx * sp * dt; e.y += my * sp * dt;
      if (e.state !== "aggro" && Math.abs(mx) > 0.05) e.face = mx > 0 ? 1 : -1;
      e.walk += dt * 10;
      collide(e, T.r * 0.7);
      if (e.x < 440 && e.type !== "boss") e.x = 440;
    }
  }

  function update(dt) {
    updatePlayer(dt);
    for (const e of enemies) if (!e.dead) updateEnemy(e, dt);
    enemies = enemies.filter((e) => !e.dead);
    for (const r of respawns) r.t -= dt;
    const ready = respawns.filter((r) => r.t <= 0);
    respawns = respawns.filter((r) => r.t > 0);
    for (const r of ready) {
      if (r.type !== "boss") spawn(r.type);
      else if (S.qi >= 2) spawnBoss();
    }
    for (const t of texts) t.t += dt;
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; p.vx *= 0.97; }
    for (const r of rings) r.t += dt;
    if (clickMark) { clickMark.t += dt; if (clickMark.t > 0.6) clickMark = null; }
    for (const arr of [texts, parts, rings]) for (let i = arr.length - 1; i >= 0; i--) if (arr[i].t >= arr[i].life) arr.splice(i, 1);
  }

  // ---------- draw ----------
  const labels = [];
  const shadow = (ax, ay, rx, ry) => fillEll(b, ax, ay, rx, ry, "rgba(10,20,5,0.3)");
  function bar(ax, ay, w, frac, col) {
    b.fillStyle = "#120d18"; b.fillRect(ax - (w >> 1) - 1, ay - 1, w + 2, 4);
    b.fillStyle = "#3a2a3a"; b.fillRect(ax - (w >> 1), ay, w, 2);
    b.fillStyle = col; b.fillRect(ax - (w >> 1), ay, Math.max(0, Math.round(w * clamp(frac, 0, 1))), 2);
  }

  function drawSword(hx, hy, ang, face) {
    const a = face > 0 ? ang : Math.PI - ang;
    const cx = Math.cos(a), cy = Math.sin(a), px = -cy, py = cx;
    for (let i = 0; i <= 12; i++) {
      const x = Math.round(hx + cx * i), y = Math.round(hy + cy * i);
      if (i < 2) { b.fillStyle = "#4a2c16"; b.fillRect(x, y, 1, 1); }
      else if (i === 2) {
        b.fillStyle = "#f2c94c";
        for (let k = -2; k <= 2; k++) b.fillRect(Math.round(x + px * k), Math.round(y + py * k), 1, 1);
      } else {
        b.fillStyle = "#5a6470"; b.fillRect(Math.round(x + px), Math.round(y + py), 1, 1);
        b.fillStyle = i === 12 ? "#ffffff" : "#e8eef5"; b.fillRect(x, y, 1, 1);
      }
    }
  }

  function drawPlayer(t) {
    const ax = Math.round(P.x / A), ay = Math.round(P.y / A);
    shadow(ax, ay, 7, 2);
    const step = Math.floor(P.walk) % 4;
    const frame = P.moving ? [1, 0, 2, 0][step] : 0;
    const bob = P.moving ? (step % 2 ? -1 : 0) : Math.floor(t * 2) % 2 ? 0 : 0;
    const spr = P.face > 0 ? HERO[frame].r : HERO[frame].l;
    const hx = ax + (P.face > 0 ? 4 : -5), hy = ay - 9 + bob;
    const swinging = P.swing > 0;
    const ang = swinging ? -1.9 + (1 - P.swing / 0.22) * 3.1 : -0.9;
    if (!swinging) drawSword(hx, hy, ang, P.face);
    if (P.hurtT > 0) b.globalAlpha = 0.55;
    b.drawImage(spr, ax - 8, ay - 22 + bob);
    b.globalAlpha = 1;
    if (swinging) {
      drawSword(hx, hy, ang, P.face);
      const f = P.swing / 0.22;
      b.globalAlpha = 0.9 * f;
      const a0 = -1.9, a1 = ang;
      for (let a = a0; a <= a1; a += 0.08) {
        const aa = P.face > 0 ? a : Math.PI - a;
        b.fillStyle = "#ffffff"; b.fillRect(Math.round(hx + Math.cos(aa) * 15), Math.round(hy + Math.sin(aa) * 15), 1, 1);
        b.fillStyle = "#bfe4ff"; b.fillRect(Math.round(hx + Math.cos(aa) * 14), Math.round(hy + Math.sin(aa) * 14), 1, 1);
      }
      b.globalAlpha = 1;
    }
    bar(ax, ay + 3, 14, P.hp / P.maxHp, "#7ed957");
    labels.push({ ax, ay: ay - 25, text: "Kiếm Khách", color: "#f2c94c" });
  }

  function drawChicken(e) {
    const s = e.T.size, ax = Math.round(e.x / A), ay = Math.round(e.y / A);
    shadow(ax, ay, 5 * s, Math.max(1, Math.round(1.5 * s)));
    const set = e.hitT > 0 ? CHICKS[e.type].white : CHICKS[e.type].frames;
    const fr = e.moving && Math.floor(e.walk) % 2 ? 1 : 0;
    const spr = e.face > 0 ? set[fr].r : set[fr].l;
    const bob = e.moving && Math.floor(e.walk) % 2 ? -s : 0;
    const peck = e.peck > 0 ? s : 0;
    const x0 = ax - 6 * s + peck * e.face, y0 = ay - 12 * s + bob + peck;
    b.drawImage(spr, x0, y0, 12 * s, 12 * s);
    if (e.type === "boss") {
      const cx = x0 + (e.face > 0 ? 8.5 : 3.5) * s - 3.5 * 2;
      b.drawImage(e.face > 0 ? CROWN.r : CROWN.l, Math.round(cx), y0 - 8, 14, 10);
    }
    const top = y0 - (e.type === "boss" ? 10 : 2);
    if (e.hp < e.maxHp || e.type === "boss") bar(ax, top - 3, e.type === "boss" ? 30 : 12, e.hp / e.maxHp, "#e0453a");
    if (P.target === e) pixRing(b, ax, ay, 7 * s, 3 * s, "#ff5a4a");
    labels.push({
      ax, ay: top - 5, text: `${e.T.name} Lv.${e.lv}`,
      color: e.type === "boss" ? "#ffb14a" : e.state === "aggro" ? "#ff8a7a" : "#fff3d6",
    });
  }

  function textOut(text, x, y, size, color) {
    ctx.font = `${size}px ${PIX}`;
    const o = Math.max(1, Math.round(size / 14));
    ctx.fillStyle = "#120d18";
    ctx.fillText(text, x - o, y); ctx.fillText(text, x + o, y); ctx.fillText(text, x, y - o); ctx.fillText(text, x, y + o);
    ctx.fillText(text, x + o, y + o);
    ctx.fillStyle = color; ctx.fillText(text, x, y);
  }

  function draw(t) {
    const bw = buf.width, bh = buf.height;
    camX = bw >= AW ? Math.round((AW - bw) / 2) : clamp(Math.round(P.x / A - bw / 2), 0, AW - bw);
    camY = bh >= AH ? Math.round((AH - bh) / 2) : clamp(Math.round(P.y / A - bh / 2), 0, AH - bh);
    b.setTransform(1, 0, 0, 1, 0, 0);
    b.fillStyle = "#2c5a22"; b.fillRect(0, 0, bw, bh);
    b.drawImage(groundArt, -camX, -camY);
    b.setTransform(1, 0, 0, 1, -camX, -camY);
    labels.length = 0;

    if (clickMark) {
      const f = clickMark.t / 0.6;
      pixRing(b, clickMark.x / A, clickMark.y / A, 2 + f * 6, 1 + f * 3, `rgba(255,243,214,${1 - f})`);
    }
    for (const e of enemies) if (e.slam) {
      const f = 1 - e.slam.t / 0.9, cx = Math.round(e.slam.x / A), cy = Math.round(e.slam.y / A), rx = 35, ry = 17;
      b.fillStyle = "rgba(255,60,40,0.4)";
      for (let dy = -ry; dy <= ry; dy++) {
        const w = Math.round(rx * Math.sqrt(1 - (dy / (ry + 0.5)) ** 2)), inner = Math.round(w * f);
        for (let dx = -w; dx <= w; dx++) if ((dx + dy) % 2 === 0 || Math.abs(dx) <= inner) b.fillRect(cx + dx, cy + dy, 1, 1);
      }
      pixRing(b, cx, cy, rx, ry, "#ff3a28");
    }

    const inView = (o, m) => o.x / A > camX - m && o.x / A < camX + bw + m && o.y / A > camY - m && o.y / A < camY + bh + m * 1.5;
    const list = [];
    for (const p of props) if (inView(p, 30)) list.push(p);
    for (const e of enemies) if (inView(e, 40)) list.push(e);
    if (!P.dead) list.push(P);
    list.sort((p, q) => p.y - q.y);
    for (const o of list) {
      if (o === P) drawPlayer(t);
      else if (o.kind === "tree") {
        const ax = Math.round(o.x / A), ay = Math.round(o.y / A);
        shadow(ax + 3, ay, 11, 3);
        b.drawImage(o.spr, ax - 15, ay - 36);
      } else if (o.kind === "house") {
        const ax = Math.round(o.x / A), ay = Math.round(o.y / A);
        shadow(ax + 2, ay, 21, 3);
        b.drawImage(o.spr, ax - 22, ay - 38);
      } else if (o.kind === "sign") {
        const ax = Math.round(o.x / A), ay = Math.round(o.y / A);
        b.drawImage(o.spr, ax - 10, ay - 17);
        labels.push({ ax, ay: ay - 19, text: "Đồng Cỏ", color: "#fff3d6" });
      } else drawChicken(o);
    }

    for (const r of rings) {
      const f = r.t / r.life, rx = (r.r / A) * (0.4 + f * 0.6);
      b.globalAlpha = 1 - f;
      pixRing(b, r.x / A, r.y / A - 2, rx, rx * 0.5, r.col);
      pixRing(b, r.x / A, r.y / A - 2, rx - 1, rx * 0.5 - 1, r.col);
    }
    b.globalAlpha = 1;
    for (const p of parts) {
      b.globalAlpha = 1 - p.t / p.life; b.fillStyle = p.col;
      b.fillRect(Math.round(p.x / A), Math.round(p.y / A), 2, 1);
    }
    b.globalAlpha = 1;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(buf, 0, 0, bw * PX, bh * PX);

    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    const ls = Math.round(17 * dpr);
    for (const l of labels) textOut(l.text, (l.ax - camX + 0.5) * PX, (l.ay - camY) * PX, ls, l.color);
    for (const tx of texts) {
      const f = tx.t / tx.life;
      if (f > 0.7 && Math.floor(tx.t * 20) % 2) continue;
      const y = ((tx.y / A - camY) * PX) - f * 30 * dpr;
      textOut(tx.text, (tx.x / A - camX) * PX, y, Math.round(tx.size * dpr * (f < 0.1 ? 1.3 : 1)), tx.color);
    }
  }

  // ---------- minimap & HUD ----------
  const mini = $("mini"), mctx = mini.getContext("2d");
  const miniBase = mk(mini.width, mini.height);
  (function () {
    const m = miniBase.getContext("2d");
    m.drawImage(groundArt, 0, 0, AW, AH, 0, 0, miniBase.width, miniBase.height);
    const kx = miniBase.width / W, ky = miniBase.height / H;
    for (const p of props) {
      m.fillStyle = p.kind === "house" ? "#ecdbb4" : p.tk === "pink" ? "#f7aac8" : p.tk === "dark" ? "#26573b" : "#2f6e27";
      const s = p.kind === "house" ? 4 : 3;
      m.fillRect(Math.round(p.x * kx) - 1, Math.round(p.y * ky) - 2, s, s);
    }
  })();
  function drawMini() {
    const kx = mini.width / W, ky = mini.height / H;
    mctx.imageSmoothingEnabled = false;
    mctx.drawImage(miniBase, 0, 0);
    for (const e of enemies) {
      mctx.fillStyle = e.type === "boss" ? "#c44dff" : e.type === "trong" ? "#ff7a2e" : "#ffffff";
      const s = e.type === "boss" ? 5 : 2;
      mctx.fillRect(Math.round(e.x * kx - s / 2), Math.round(e.y * ky - s / 2), s, s);
    }
    mctx.strokeStyle = "rgba(255,243,214,0.8)"; mctx.lineWidth = 1;
    mctx.strokeRect(Math.round(camX * A * kx) + 0.5, Math.round(camY * A * ky) + 0.5, Math.round(buf.width * A * kx), Math.round(buf.height * A * ky));
    mctx.fillStyle = "#120d18"; mctx.fillRect(Math.round(P.x * kx) - 3, Math.round(P.y * ky) - 3, 6, 6);
    mctx.fillStyle = "#f2c94c"; mctx.fillRect(Math.round(P.x * kx) - 2, Math.round(P.y * ky) - 2, 4, 4);
  }

  function zoneName() {
    if (Math.hypot(P.x - VILLAGE.x, P.y - VILLAGE.y) < 230) return "Làng Khởi Đầu";
    if (P.x > 1950 && P.y < 450) return "Tổ Vua Gà";
    if (P.x > 1650) return "Rừng Sương Ngọc Bích";
    return "Đồng Cỏ Gà Rừng";
  }

  let lastHud = "";
  function hud() {
    const need = expNeed(S.lv);
    $("hpBar").style.width = (P.hp / P.maxHp) * 100 + "%";
    $("mpBar").style.width = (P.mp / P.maxMp) * 100 + "%";
    $("expBar").style.width = (S.exp / need) * 100 + "%";
    $("skCd").style.setProperty("--cd", Math.max(0, P.skCd / 4));
    $("potCd").style.setProperty("--cd", Math.max(0, P.potCd / 1));
    const q = quest();
    const key = [Math.ceil(P.hp), Math.floor(P.mp), S.lv, S.gold, S.kills, S.pot, S.qi, S.qp, Math.round(P.x / 10), Math.round(P.y / 10)].join();
    if (key === lastHud) return;
    lastHud = key;
    $("hpTxt").textContent = `${Math.ceil(P.hp)}/${P.maxHp}`;
    $("mpTxt").textContent = `${Math.floor(P.mp)}/${P.maxMp}`;
    $("lv").textContent = `Lv.${S.lv}`;
    $("gold").textContent = S.gold;
    $("kills").textContent = S.kills;
    $("potN").textContent = S.pot;
    $("qTitle").textContent = q.title;
    $("qText").textContent = q.text;
    $("qProg").textContent = `${S.qp}/${q.need}`;
    $("qProg").classList.toggle("done", S.qp >= q.need);
    $("coord").textContent = `${Math.round(P.x / 10)}, ${Math.round(P.y / 10)}`;
    $("zone").textContent = zoneName();
  }

  // ---------- boot ----------
  $("avatar").getContext("2d").drawImage(HERO[0].r, 0, 0, 16, 16, 0, 1, 16, 16);
  for (const [id, [rows, pal]] of Object.entries(ICONS)) $(id).getContext("2d").drawImage(sprite(rows, pal), 0, 0);

  load();
  applyStats(true);
  resize();
  for (const [type, n] of Object.entries(COUNT)) for (let i = 0; i < n; i++) spawn(type);
  if (S.qi >= 2) spawn("boss");
  toast(S.kills ? "Chào mừng trở lại, Kiếm Khách!" : "Chào mừng đến Đồng Cỏ Gà Rừng!", true);
  setTimeout(() => toast(`Nhiệm vụ: ${quest().title}`), 900);
  setInterval(save, 5000);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw(now / 1000);
    drawMini();
    hud();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
